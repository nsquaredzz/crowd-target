name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
        with:
          path: crowd-target
      - uses: actions/checkout@v4
        with:
          repository: nsquaredzz/certified-track
          path: certified-track
      - uses: actions/checkout@v4
        with:
          repository: nsquaredzz/certified-skip
          path: certified-skip
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install numpy pillow scipy pytest
          python -m pip install --no-deps -e certified-track -e crowd-target
      - name: Run the tests (no data, no torch)
        working-directory: crowd-target
        env:
          PYTHONPATH: ${{ github.workspace }}/certified-skip/python
        run: python -m pytest tests -q
